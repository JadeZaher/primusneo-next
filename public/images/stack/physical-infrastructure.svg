  <text x="52" y="94" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="3" fill="#55595F">POWER → COMPUTE → STORAGE</text>
  <text x="676" y="754" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" letter-spacing="4" fill="#4D6BFF">L—00</text>
  <text x="52" y="754" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="3" fill="#55595F">PARTNERSHIP: STARTING</text>
