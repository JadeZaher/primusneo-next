<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <rect width="800" height="800" fill="#0B0C0E"/>
  <!-- fractal collapse: telemetry leaves feed upward into one insight line -->
  <g stroke="#39404D" stroke-width="1">
    <!-- level 4 → leaves -->
    <line x1="145" y1="620" x2="110" y2="676"/>
    <line x1="145" y1="620" x2="180" y2="676"/>
    <line x1="215" y1="620" x2="250" y2="676"/>
    <line x1="215" y1="620" x2="215" y2="676"/>
    <line x1="290" y1="620" x2="290" y2="676"/>
    <line x1="290" y1="620" x2="325" y2="676"/>
    <line x1="360" y1="620" x2="395" y2="676"/>
    <line x1="360" y1="620" x2="360" y2="676"/>
    <line x1="440" y1="620" x2="440" y2="676"/>
    <line x1="440" y1="620" x2="475" y2="676"/>
    <line x1="510" y1="620" x2="545" y2="676"/>
    <line x1="510" y1="620" x2="510" y2="676"/>
    <line x1="585" y1="620" x2="585" y2="676"/>
    <line x1="585" y1="620" x2="620" y2="676"/>
    <line x1="655" y1="620" x2="690" y2="676"/>
    <line x1="655" y1="620" x2="655" y2="676"/>
    <!-- level 3 -->
    <line x1="180" y1="520" x2="145" y2="620"/>
    <line x1="180" y1="520" x2="215" y2="620"/>
    <line x1="325" y1="520" x2="290" y2="620"/>
    <line x1="325" y1="520" x2="360" y2="620"/>
    <line x1="475" y1="520" x2="440" y2="620"/>
    <line x1="475" y1="520" x2="510" y2="620"/>
    <line x1="620" y1="520" x2="585" y2="620"/>
    <line x1="620" y1="520" x2="655" y2="620"/>
    <!-- level 2 -->
    <line x1="252" y1="400" x2="180" y2="520"/>
    <line x1="252" y1="400" x2="325" y2="520"/>
    <line x1="548" y1="400" x2="475" y2="520"/>
    <line x1="548" y1="400" x2="620" y2="520"/>
    <!-- level 1 -->
    <line x1="400" y1="270" x2="252" y2="400"/>
    <line x1="400" y1="270" x2="548" y2="400"/>
  </g>
  <!-- accent path: one signal surfaced -->
  <g stroke="#4D6BFF" stroke-width="1.5">
    <line x1="475" y1="676" x2="440" y2="620"/>
    <line x1="440" y1="620" x2="475" y2="520"/>
    <line x1="475" y1="520" x2="548" y2="400"/>
    <line x1="548" y1="400" x2="400" y2="270"/>
    <line x1="400" y1="270" x2="400" y2="150"/>
  </g>
  <!-- telemetry leaves -->
  <g fill="#55595F">
    <circle cx="110" cy="680" r="3"/>
    <circle cx="180" cy="680" r="3"/>
    <circle cx="215" cy="680" r="3"/>
    <circle cx="250" cy="680" r="3"/>
    <circle cx="290" cy="680" r="3"/>
    <circle cx="325" cy="680" r="3"/>
    <circle cx="360" cy="680" r="3"/>
    <circle cx="395" cy="680" r="3"/>
    <circle cx="440" cy="680" r="3"/>
    <circle cx="510" cy="680" r="3"/>
    <circle cx="545" cy="680" r="3"/>
    <circle cx="585" cy="680" r="3"/>
    <circle cx="620" cy="680" r="3"/>
    <circle cx="655" cy="680" r="3"/>
    <circle cx="690" cy="680" r="3"/>
  </g>
  <circle cx="475" cy="680" r="4" fill="#4D6BFF"/>
  <!-- junction nodes -->
  <g fill="#E8E9EB">
    <circle cx="252" cy="400" r="4"/>
    <circle cx="548" cy="400" r="4"/>
  </g>
  <circle cx="400" cy="270" r="5" fill="#4D6BFF"/>
  <!-- insight terminal -->
  <circle cx="400" cy="144" r="6" stroke="#4D6BFF" stroke-width="1.5"/>
  <text x="420" y="150" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="3" fill="#8A8F98">INSIGHT_OUT</text>
  <text x="420" y="700" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="3" fill="#55595F">TELEMETRY_IN ×1024</text>
  <!-- frame + HUD -->
  <rect x="24" y="24" width="752" height="752" stroke="#2A2E36" stroke-width="1"/>
  <g stroke="#55595F" stroke-width="1">
    <path d="M24 60 L24 24 L60 24"/>
    <path d="M740 24 L776 24 L776 60"/>
    <path d="M776 740 L776 776 L740 776"/>
    <path d="M60 776 L24 776 L24 740"/>
  </g>
  <text x="52" y="72" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" letter-spacing="4" fill="#8A8F98">FRACTAL // ENGINE</text>
  <text x="52" y="94" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="3" fill="#55595F">TELEMETRY → DURABLE INSIGHT</text>
  <text x="676" y="754" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" letter-spacing="4" fill="#4D6BFF">L—04</text>
  <text x="52" y="754" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="3" fill="#55595F">SIGNAL: SURFACED</text>
</svg>
