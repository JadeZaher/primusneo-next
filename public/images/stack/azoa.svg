<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <rect width="800" height="800" fill="#0B0C0E"/>
  <!-- orbital guide -->
  <circle cx="400" cy="410" r="250" stroke="#1C212B" stroke-width="1"/>
  <!-- spokes -->
  <g stroke="#39404D" stroke-width="1" stroke-dasharray="4 6">
    <line x1="400" y1="410" x2="400" y2="160"/>
    <line x1="400" y1="410" x2="577" y2="233"/>
    <line x1="400" y1="410" x2="650" y2="410"/>
    <line x1="400" y1="410" x2="577" y2="587"/>
    <line x1="400" y1="410" x2="400" y2="660"/>
    <line x1="400" y1="410" x2="223" y2="587"/>
    <line x1="400" y1="410" x2="150" y2="410"/>
    <line x1="400" y1="410" x2="223" y2="233"/>
  </g>
  <!-- active route -->
  <line x1="400" y1="410" x2="577" y2="233" stroke="#4D6BFF" stroke-width="1.5"/>
  <!-- satellite nodes -->
  <g stroke="#55595F" stroke-width="1">
    <rect x="390" y="150" width="20" height="20"/>
    <rect x="640" y="400" width="20" height="20"/>
    <rect x="390" y="650" width="20" height="20"/>
    <rect x="140" y="400" width="20" height="20"/>
    <rect x="567" y="577" width="20" height="20"/>
    <rect x="213" y="577" width="20" height="20"/>
    <rect x="213" y="223" width="20" height="20"/>
  </g>
  <rect x="567" y="223" width="20" height="20" stroke="#4D6BFF" stroke-width="1.5"/>
  <!-- hub -->
  <rect x="368" y="378" width="64" height="64" stroke="#4D6BFF" stroke-width="1.5"/>
  <rect x="384" y="394" width="32" height="32" stroke="#E8E9EB" stroke-width="1"/>
  <text x="400" y="415" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="1" fill="#E8E9EB">API</text>
  <!-- satellite labels -->
  <g font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="3" fill="#55595F">
    <text x="400" y="136" text-anchor="middle">CHAINS</text>
    <text x="596" y="216" fill="#4D6BFF">IDENTITY</text>
    <text x="672" y="414">STORAGE</text>
    <text x="596" y="618">AVATARS</text>
    <text x="400" y="696" text-anchor="middle">REPUTATION</text>
    <text x="204" y="618" text-anchor="end">WALLETS</text>
    <text x="128" y="414" text-anchor="end">CLOUD</text>
    <text x="204" y="216" text-anchor="end">DATA</text>
  </g>
  <!-- frame + HUD -->
  <rect x="24" y="24" width="752" height="752" stroke="#2A2E36" stroke-width="1"/>
  <g stroke="#55595F" stroke-width="1">
    <path d="M24 60 L24 24 L60 24"/>
    <path d="M740 24 L776 24 L776 60"/>
    <path d="M776 740 L776 776 L740 776"/>
    <path d="M60 776 L24 776 L24 740"/>
  </g>
  <text x="52" y="72" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" letter-spacing="4" fill="#8A8F98">AZOA // RAILS</text>
  <text x="52" y="94" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="3" fill="#55595F">ONE API ACROSS EVERYTHING</text>
  <text x="676" y="754" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" letter-spacing="4" fill="#4D6BFF">L—03</text>
  <text x="52" y="754" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="3" fill="#55595F">PROVIDERS: ABSTRACTED</text>
</svg>
