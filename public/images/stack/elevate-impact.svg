<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <rect width="800" height="800" fill="#0B0C0E"/>
  <!-- study lifecycle: six gated stages on one line, ending in an accent node -->
  <g stroke="#2A2E36" stroke-width="1" stroke-dasharray="3 5">
    <line x1="120" y1="250" x2="120" y2="550"/>
    <line x1="232" y1="250" x2="232" y2="550"/>
    <line x1="344" y1="250" x2="344" y2="550"/>
    <line x1="456" y1="250" x2="456" y2="550"/>
    <line x1="568" y1="250" x2="568" y2="550"/>
    <line x1="680" y1="250" x2="680" y2="550"/>
  </g>
  <line x1="120" y1="400" x2="680" y2="400" stroke="#39404D" stroke-width="1"/>
  <line x1="568" y1="400" x2="680" y2="400" stroke="#4D6BFF" stroke-width="1.5"/>
  <!-- gates -->
  <g stroke="#55595F" stroke-width="1">
    <rect x="112" y="392" width="16" height="16"/>
    <rect x="224" y="392" width="16" height="16"/>
    <rect x="336" y="392" width="16" height="16"/>
    <rect x="448" y="392" width="16" height="16"/>
    <rect x="560" y="392" width="16" height="16"/>
  </g>
  <g fill="#E8E9EB">
    <circle cx="120" cy="400" r="3"/>
    <circle cx="232" cy="400" r="3"/>
    <circle cx="344" cy="400" r="3"/>
    <circle cx="456" cy="400" r="3"/>
    <circle cx="568" cy="400" r="3"/>
  </g>
  <circle cx="680" cy="400" r="6" fill="#4D6BFF"/>
  <circle cx="680" cy="400" r="14" stroke="#4D6BFF" stroke-width="1"/>
  <!-- community seats above the line -->
  <g stroke="#39404D" stroke-width="1">
    <line x1="232" y1="400" x2="232" y2="330"/>
    <line x1="456" y1="400" x2="456" y2="330"/>
  </g>
  <g fill="#8A8F98">
    <circle cx="232" cy="326" r="3"/>
    <circle cx="456" cy="326" r="3"/>
  </g>
  <text x="120" y="450" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="3" fill="#55595F">QUESTION</text>
  <text x="600" y="450" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="3" fill="#8A8F98">DESIGN</text>
  <text x="232" y="306" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="3" fill="#55595F">CO-DESIGNERS</text>
  <!-- frame + HUD -->
  <rect x="24" y="24" width="752" height="752" stroke="#2A2E36" stroke-width="1"/>
  <g stroke="#55595F" stroke-width="1">
    <path d="M24 60 L24 24 L60 24"/>
    <path d="M740 24 L776 24 L776 60"/>
    <path d="M776 740 L776 776 L740 776"/>
    <path d="M60 776 L24 776 L24 740"/>
  </g>
  <text x="52" y="72" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" letter-spacing="4" fill="#8A8F98">ELEVATE // IMPACT</text>
  <text x="52" y="94" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="3" fill="#55595F">QUESTION → CHECKED STUDY DESIGN</text>
  <text x="676" y="754" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" letter-spacing="4" fill="#4D6BFF">L—05</text>
  <text x="52" y="754" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="3" fill="#55595F">GATES: 5 / DESIGN: OUT</text>
</svg>
